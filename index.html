<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ViveX Store</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:30px 15px;
}

.container{
    width:100%;
    max-width:400px;
}

.brand{
    text-align:center;
    font-size:36px;
    font-weight:bold;
    margin-bottom:25px;
}

.product{
    background:#1c1c1c;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.4);
}

.product img{
    width:100%;
    max-width:280px;
    height:280px;
    object-fit:contain;
    border-radius:15px;
}

.product h2{
    margin:18px 0 8px;
    font-size:25px;
}

.price{
    font-size:25px;
    font-weight:bold;
    margin-bottom:20px;
}

button{
    cursor:pointer;
}

.order-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:white;
    color:black;
    font-size:18px;
    font-weight:bold;
}

.order-btn:active,
.place-btn:active,
.close-btn:active{
    transform:scale(.98);
}

.form-box{
    display:none;
    margin-top:20px;
    background:#1c1c1c;
    padding:20px;
    border-radius:20px;
}

.form-box h2{
    margin-top:0;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:1px solid #444;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:white;
}

input::placeholder{
    color:#888;
}

.place-btn{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00ff88;
    color:black;
    font-size:17px;
    font-weight:bold;
}

.place-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.popup-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:999;
}

.popup{
    width:100%;
    max-width:330px;
    background:#1c1c1c;
    border-radius:20px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.6);
}

.success-icon{
    width:65px;
    height:65px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#00ff88;
    color:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    font-weight:bold;
}

.popup h2{
    margin:10px 0;
    font-size:25px;
}

.popup p{
    color:#ccc;
    line-height:1.5;
}

.close-btn{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:white;
    color:black;
    font-size:16px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="brand">
        ViveX
    </div>

    <div class="product">

        <img
            src="https://cdn.postimage.me/2026/09/04/368.png"
            alt="ViveX Product"
        >

        <h2>ViveX Product</h2>

        <div class="price">
            ₹499
        </div>

        <button
            class="order-btn"
            onclick="showOrderForm()">
            ORDER NOW
        </button>

    </div>


    <div
        class="form-box"
        id="orderForm">

        <h2>Delivery Details</h2>

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            autocomplete="name">

        <input
            type="tel"
            id="phone"
            placeholder="Mobile Number"
            inputmode="numeric"
            maxlength="10"
            autocomplete="tel">

        <input
            type="text"
            id="state"
            placeholder="State"
            autocomplete="address-level1">

        <input
            type="text"
            id="district"
            placeholder="District">

        <input
            type="text"
            id="city"
            placeholder="City / Village"
            autocomplete="address-level2">

        <input
            type="text"
            id="pincode"
            placeholder="Pincode"
            inputmode="numeric"
            maxlength="6"
            autocomplete="postal-code">

        <input
            type="text"
            id="landmark"
            placeholder="Landmark (Optional)">

        <button
            class="place-btn"
            id="placeBtn"
            onclick="placeOrder()">
            PLACE ORDER
        </button>

    </div>

</div>


<div
    class="popup-bg"
    id="successPopup">

    <div class="popup">

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Order Successful!
        </h2>

        <p>
            Thank you for your order.
            Your order has been placed successfully.
        </p>

        <button
            class="close-btn"
            onclick="closePopup()">
            OK
        </button>

    </div>

</div>


<script>

function showOrderForm(){

    const form =
        document.getElementById("orderForm");

    form.style.display = "block";

    form.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}


async function placeOrder(){

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const state =
        document.getElementById("state").value.trim();

    const district =
        document.getElementById("district").value.trim();

    const city =
        document.getElementById("city").value.trim();

    const pincode =
        document.getElementById("pincode").value.trim();

    const landmark =
        document.getElementById("landmark").value.trim();

    const button =
        document.getElementById("placeBtn");


    /* REQUIRED FIELDS */

    if(
        name === "" ||
        phone === "" ||
        state === "" ||
        district === "" ||
        city === "" ||
        pincode === ""
    ){

        alert(
            "Please fill all required details."
        );

        return;
    }


    /* MOBILE VALIDATION */

    if(!/^[6-9]\d{9}$/.test(phone)){

        alert(
            "Please enter a valid 10-digit mobile number."
        );

        return;
    }


    /* PINCODE VALIDATION */

    if(!/^\d{6}$/.test(pincode)){

        alert(
            "Please enter a valid 6-digit pincode."
        );

        return;
    }


    button.disabled = true;

    button.innerText =
        "PLACING ORDER...";


    /* FORM DATA */

    const formData =
        new FormData();

    formData.append(
        "Name",
        name
    );

    formData.append(
        "Mobile Number",
        phone
    );

    formData.append(
        "State",
        state
    );

    formData.append(
        "District",
        district
    );

    formData.append(
        "City / Village",
        city
    );

    formData.append(
        "Pincode",
        pincode
    );

    formData.append(
        "Landmark",
        landmark || "Not provided"
    );

    formData.append(
        "Product",
        "ViveX Product"
    );

    formData.append(
        "Price",
        "₹499"
    );

    formData.append(
        "Order Time",
        new Date().toLocaleString("en-IN")
    );

    formData.append(
        "_subject",
        "New ViveX Store Order"
    );

    formData.append(
        "_template",
        "table"
    );

    formData.append(
        "_captcha",
        "true"
    );


    try{

        const response =
            await fetch(
                "https://formsubmit.co/ajax/itsvivex@gmail.com",
                {
                    method:"POST",
                    body:formData,
                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        const result =
            await response.json();


        console.log(
            "FormSubmit:",
            result
        );


        if(
            response.ok &&
            result.success
        ){

            document
                .getElementById("successPopup")
                .style.display = "flex";


            /* CLEAR FORM */

            document.getElementById("name").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("state").value = "";
            document.getElementById("district").value = "";
            document.getElementById("city").value = "";
            document.getElementById("pincode").value = "";
            document.getElementById("landmark").value = "";

        }
        else{

            alert(
                "Order submit nahi hua.\n\n" +
                (
                    result.message ||
                    "Please try again."
                )
            );

        }

    }
    catch(error){

        console.error(error);

        alert(
            "Order submit nahi hua. Internet connection check karo."
        );

    }
    finally{

        button.disabled = false;

        button.innerText =
            "PLACE ORDER";

    }

}


function closePopup(){

    document
        .getElementById("successPopup")
        .style.display = "none";

}

</script>

</body>
  </html>
