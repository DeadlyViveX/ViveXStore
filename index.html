<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ViveX Store</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:25px 15px;
}

.container{
    width:100%;
    max-width:420px;
    margin:auto;
}


/* =========================
   BRAND
========================= */

.brand{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    margin-bottom:25px;
}


/* =========================
   PRODUCT
========================= */

.product{
    background:#1c1c1c;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.4);
}

.product img{
    width:100%;
    max-width:280px;
    height:280px;
    object-fit:contain;
    border-radius:15px;
}

.product h2{
    margin:18px 0 8px;
    font-size:25px;
}

.price{
    font-size:25px;
    font-weight:bold;
    margin-bottom:20px;
}


/* =========================
   BUTTON
========================= */

button{
    cursor:pointer;
}

.order-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#fff;
    color:#000;
    font-size:18px;
    font-weight:bold;
}

.order-btn:active{
    transform:scale(.98);
}


/* =========================
   FORM
========================= */

.form-box{
    display:none;
    margin-top:20px;
    background:#1c1c1c;
    padding:20px;
    border-radius:20px;
}

.form-box h2{
    margin:0 0 15px;
}

input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:1px solid #444;
    border-radius:10px;
    background:#111;
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#fff;
}

input::placeholder{
    color:#888;
}

.place-btn{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00ff88;
    color:#000;
    font-size:17px;
    font-weight:bold;
}

.place-btn:disabled{
    opacity:.6;
}


/* =========================
   MY ORDERS BUTTON
========================= */

.my-orders-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:1px solid #555;
    border-radius:12px;
    background:#1c1c1c;
    color:#fff;
    font-size:17px;
    font-weight:bold;
}


/* =========================
   MY ORDERS
========================= */

.orders-box{
    display:none;
    margin-top:20px;
}

.orders-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:15px;
}

.no-orders{
    background:#1c1c1c;
    border-radius:15px;
    padding:20px;
    text-align:center;
    color:#aaa;
}


/* =========================
   ORDER CARD
========================= */

.order-card{
    background:#1c1c1c;
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
}

.order-id{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.order-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    color:#ccc;
}

.order-row strong{
    color:#fff;
}


/* =========================
   STATUS
========================= */

.status{
    display:inline-block;
    margin-top:12px;
    padding:8px 12px;
    border-radius:20px;
    background:#333;
    color:#00ff88;
    font-size:14px;
    font-weight:bold;
}


/* =========================
   POPUP
========================= */

.popup-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:999;
}

.popup{
    width:100%;
    max-width:340px;
    background:#1c1c1c;
    border-radius:20px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.6);
}

.success-icon{
    width:65px;
    height:65px;
    margin:auto;
    border-radius:50%;
    background:#00ff88;
    color:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    font-weight:bold;
}

.popup h2{
    margin:15px 0 8px;
}

.popup p{
    color:#ccc;
    line-height:1.5;
}

.close-btn{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#fff;
    color:#000;
    font-size:16px;
    font-weight:bold;
}

</style>
</head>


<body>

<div class="container">


    <!-- =========================
         BRAND
    ========================== -->

    <div class="brand">
        ViveX
    </div>


    <!-- =========================
         PRODUCT
    ========================== -->

    <div class="product">

        <img
            src="https://cdn.postimage.me/2026/09/04/368.png"
            alt="ViveX Product"
        >

        <h2>
            ViveX Product
        </h2>

        <div class="price">
            ₹499
        </div>

        <button
            class="order-btn"
            onclick="showOrderForm()"
        >
            ORDER NOW
        </button>

    </div>


    <!-- =========================
         ORDER FORM
    ========================== -->

    <div
        class="form-box"
        id="orderForm"
    >

        <h2>
            Delivery Details
        </h2>


        <input
            type="text"
            id="name"
            placeholder="Full Name"
            autocomplete="name"
        >


        <input
            type="tel"
            id="phone"
            placeholder="Mobile Number"
            inputmode="numeric"
            maxlength="10"
            autocomplete="tel"
        >


        <input
            type="text"
            id="state"
            placeholder="State"
            autocomplete="address-level1"
        >


        <input
            type="text"
            id="district"
            placeholder="District"
        >


        <input
            type="text"
            id="city"
            placeholder="City / Village"
            autocomplete="address-level2"
        >


        <input
            type="text"
            id="pincode"
            placeholder="Pincode"
            inputmode="numeric"
            maxlength="6"
            autocomplete="postal-code"
        >


        <input
            type="text"
            id="landmark"
            placeholder="Landmark (Optional)"
        >


        <button
            class="place-btn"
            id="placeBtn"
            onclick="placeOrder()"
        >
            PLACE ORDER
        </button>

    </div>


    <!-- =========================
         MY ORDERS BUTTON
    ========================== -->

    <button
        class="my-orders-btn"
        onclick="showOrders()"
    >
        📦 MY ORDERS
    </button>


    <!-- =========================
         MY ORDERS
    ========================== -->

    <div
        class="orders-box"
        id="ordersBox"
    >

        <div class="orders-title">
            My Orders
        </div>

        <div id="ordersList"></div>

    </div>

</div>


<!-- =========================
     SUCCESS POPUP
========================== -->

<div
    class="popup-bg"
    id="successPopup"
>

    <div class="popup">

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Order Successful!
        </h2>

        <p id="successText">
            Your order has been placed successfully.
        </p>

        <button
            class="close-btn"
            onclick="closePopup()"
        >
            OK
        </button>

    </div>

</div>


<script>


/* =====================================================
   SHOW ORDER FORM
===================================================== */

function showOrderForm(){

    const form =
        document.getElementById("orderForm");

    form.style.display = "block";

    form.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}


/* =====================================================
   GENERATE ORDER ID
===================================================== */

function generateOrderID(){

    const number =
        Math.floor(
            100000 +
            Math.random() * 900000
        );

    return "VX-" + number;
}


/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder(){

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const state =
        document.getElementById("state").value.trim();

    const district =
        document.getElementById("district").value.trim();

    const city =
        document.getElementById("city").value.trim();

    const pincode =
        document.getElementById("pincode").value.trim();

    const landmark =
        document.getElementById("landmark").value.trim();

    const button =
        document.getElementById("placeBtn");


    /* REQUIRED */

    if(
        name === "" ||
        phone === "" ||
        state === "" ||
        district === "" ||
        city === "" ||
        pincode === ""
    ){

        alert(
            "Please fill all required details."
        );

        return;
    }


    /* MOBILE */

    if(
        !/^[6-9]\d{9}$/.test(phone)
    ){

        alert(
            "Please enter a valid 10-digit mobile number."
        );

        return;
    }


    /* PINCODE */

    if(
        !/^\d{6}$/.test(pincode)
    ){

        alert(
            "Please enter a valid 6-digit pincode."
        );

        return;
    }


    button.disabled = true;

    button.innerText =
        "PLACING ORDER...";


    /* ORDER ID */

    const orderID =
        generateOrderID();


    /* ORDER TIME */

    const orderTime =
        new Date().toLocaleString("en-IN");


    /* =================================================
       SAVE ORDER LOCALLY
    ================================================= */

    const order = {

        id:orderID,

        product:"ViveX Product",

        price:"₹499",

        name:name,

        phone:phone,

        state:state,

        district:district,

        city:city,

        pincode:pincode,

        landmark:
            landmark || "Not provided",

        time:orderTime,

        status:"Order Placed"

    };


    let orders =
        JSON.parse(
            localStorage.getItem(
                "vivexOrders"
            )
        ) || [];


    orders.unshift(order);


    localStorage.setItem(
        "vivexOrders",
        JSON.stringify(orders)
    );


    /* =================================================
       CREATE EMAIL DATA
    ================================================= */

    const formData =
        new FormData();


    formData.append(
        "Order ID",
        orderID
    );

    formData.append(
        "Name",
        name
    );

    formData.append(
        "Mobile Number",
        phone
    );

    formData.append(
        "State",
        state
    );

    formData.append(
        "District",
        district
    );

    formData.append(
        "City / Village",
        city
    );

    formData.append(
        "Pincode",
        pincode
    );

    formData.append(
        "Landmark",
        landmark || "Not provided"
    );

    formData.append(
        "Product",
        "ViveX Product"
    );

    formData.append(
        "Price",
        "₹499"
    );

    formData.append(
        "Order Status",
        "Order Placed"
    );

    formData.append(
        "Order Time",
        orderTime
    );

    formData.append(
        "_subject",
        "New ViveX Order - " + orderID
    );

    formData.append(
        "_template",
        "table"
    );

    formData.append(
        "_captcha",
        "true"
    );


    /* =================================================
       SEND TO GMAIL
    ================================================= */

    try{

        const response =
            await fetch(
                "https://formsubmit.co/ajax/itsvivex@gmail.com",
                {
                    method:"POST",

                    body:formData,

                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        const result =
            await response.json();


        console.log(
            "FormSubmit Response:",
            result
        );


        /* =================================================
           SUCCESS
        ================================================= */

        if(
            response.ok &&
            result.success
        ){

            document.getElementById(
                "successText"
            ).innerHTML =
                "Your order has been placed successfully.<br><br>" +
                "<b>Order ID: " +
                orderID +
                "</b>";


            document.getElementById(
                "successPopup"
            ).style.display = "flex";


            clearForm();

            renderOrders();

        }

        else{

            /*
              Local order already saved.
              Show order ID even if email service fails.
            */

            document.getElementById(
                "successText"
            ).innerHTML =
                "Order saved on this device.<br><br>" +
                "<b>Order ID: " +
                orderID +
                "</b><br><br>" +
                "Email delivery failed. Please check FormSubmit activation.";

            document.getElementById(
                "successPopup"
            ).style.display = "flex";

        }

    }

    catch(error){

        console.error(
            error
        );


        /*
          Keep local order
        */

        document.getElementById(
            "successText"
        ).innerHTML =
            "Order saved on this device.<br><br>" +
            "<b>Order ID: " +
            orderID +
            "</b><br><br>" +
            "Email service could not be reached.";

        document.getElementById(
            "successPopup"
        ).style.display = "flex";

    }


    button.disabled = false;

    button.innerText =
        "PLACE ORDER";

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

    document.getElementById(
        "name"
    ).value = "";

    document.getElementById(
        "phone"
    ).value = "";

    document.getElementById(
        "state"
    ).value = "";

    document.getElementById(
        "district"
    ).value = "";

    document.getElementById(
        "city"
    ).value = "";

    document.getElementById(
        "pincode"
    ).value = "";

    document.getElementById(
        "landmark"
    ).value = "";
}


/* =====================================================
   SHOW MY ORDERS
===================================================== */

function showOrders(){

    const box =
        document.getElementById(
            "ordersBox"
        );


    if(
        box.style.display === "block"
    ){

        box.style.display = "none";

        return;
    }


    box.style.display = "block";

    renderOrders();


    box.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}


/* =====================================================
   DISPLAY ORDERS
===================================================== */

function renderOrders(){

    const list =
        document.getElementById(
            "ordersList"
        );


    let orders =
        JSON.parse(
            localStorage.getItem(
                "vivexOrders"
            )
        ) || [];


    /* NO ORDERS */

    if(
        orders.length === 0
    ){

        list.innerHTML = `
            <div class="no-orders">
                No orders found.
            </div>
        `;

        return;
    }


    /* CREATE ORDER CARDS */

    list.innerHTML =
        orders.map(
            function(order){

                return `

                <div class="order-card">

                    <div class="order-id">
                        🆔 ${order.id}
                    </div>

                    <div class="order-row">
                        <span>Product</span>
                        <strong>${order.product}</strong>
                    </div>

                    <div class="order-row">
                        <span>Price</span>
                        <strong>${order.price}</strong>
                    </div>

                    <div class="order-row">
                        <span>Date</span>
                        <strong>${order.time}</strong>
                    </div>

                    <div class="order-row">
                        <span>Delivery</span>
                        <strong>${order.city}</strong>
                    </div>

                    <div class="status">
                        ${order.status}
                    </div>

                </div>

                `;

            }
        ).join("");

}


/* =====================================================
   CLOSE POPUP
===================================================== */

function closePopup(){

    document.getElementById(
        "successPopup"
    ).style.display = "none";

}


/* =====================================================
   LOAD ORDERS WHEN PAGE OPENS
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        renderOrders();

    }
);

</script>

</body>
  </html>
